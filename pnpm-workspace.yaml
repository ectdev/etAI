packages:
  - apps/*
  - packages/*
# esbuild links a platform specific binary in its install script, and vitest and
# tsx both need it, so this one is allowed to run.
allowBuilds:
  esbuild: true
# pnpm refuses packages published within the last few days by default, which is a
# reasonable guard against a compromised release and a problem when the versions this
# project needs are newer than that. Each of these was checked on the registry and is
# listed at an exact version, so the exemption covers the release that was looked at and
# nothing that arrives after it.
minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.38'
  - '@ai-sdk/gateway@4.0.49'
  - '@ai-sdk/google@4.0.42'
  - '@ai-sdk/mcp@2.0.31'
  - '@ai-sdk/provider-utils@5.0.27'
  - '@ai-sdk/react@4.0.65'
  - '@better-auth/core@1.6.27'
  - '@better-auth/drizzle-adapter@1.6.27'
  - '@better-auth/kysely-adapter@1.6.27'
  - '@better-auth/memory-adapter@1.6.27'
  - '@better-auth/mongo-adapter@1.6.27'
  - '@better-auth/prisma-adapter@1.6.27'
  - '@better-auth/telemetry@1.6.27'
  - ai@7.0.62
  - better-auth@1.6.27

# drizzle-kit reaches esbuild through two deprecated @esbuild-kit packages that pin an
# old version with a known dev-server advisory. Nothing here runs that dev server, but
# the old version is not worth keeping when a supported one works.
overrides:
  esbuild: '>=0.25.12'
